openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: runs
    description: Research pipeline runs
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List recent research runs
      responses:
        "200":
          description: Saved runs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchRun"
    post:
      operationId: createRun
      tags: [runs]
      summary: Start a research pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunInput"
      responses:
        "202":
          description: Pipeline accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchRun"
  /runs/{runId}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Get a run and its checkpoints
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run details and stage checkpoints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
        "404":
          description: Run not found
  /runs/{runId}/resume:
    post:
      operationId: resumeRun
      tags: [runs]
      summary: Resume a halted pipeline from its latest checkpoint
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Pipeline resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchRun"
        "409":
          description: Run is not resumable
        "404":
          description: Run not found
  /runs/{runId}/events/{afterId}:
    get:
      operationId: streamRunEvents
      tags: [runs]
      summary: Stream run state transitions using server-sent events
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
        - name: afterId
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: SSE stream; each message has an id, event name, and JSON data
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: Run not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RunInput:
      type: object
      properties:
        topic:
          type: string
          minLength: 8
          maxLength: 280
        sourceMode:
          type: string
          enum: [live, fixtures]
          default: live
        sources:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [crossref, arxiv]
        injectRateLimit:
          type: boolean
        injectOutage:
          type: boolean
        crashAtStage4:
          type: boolean
      required: [topic]
    ResearchRun:
      type: object
      properties:
        id:
          type: string
        topic:
          type: string
        status:
          type: string
          enum: [queued, running, paused, completed, failed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        completedStages:
          type: integer
        durationMs:
          type: ["integer", "null"]
        injectRateLimit:
          type: boolean
        injectOutage:
          type: boolean
        crashAtStage4:
          type: boolean
        sourceMode:
          type: string
          enum: [live, fixtures]
        sources:
          type: array
          items:
            type: string
            enum: [crossref, arxiv]
      required: [id, topic, status, createdAt, updatedAt, completedStages, injectRateLimit, injectOutage, crashAtStage4, sourceMode, sources]
    StageCheckpoint:
      type: object
      properties:
        stage:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [pending, running, retrying, fallback, completed, failed]
        durationMs:
          type: ["integer", "null"]
        attempts:
          type: integer
        output:
          type: ["object", "null"]
          additionalProperties: true
        inputContext:
          type: ["object", "null"]
          additionalProperties: true
        resiliencePolicy:
          type: string
        message:
          type: ["string", "null"]
      required: [stage, name, status, attempts, resiliencePolicy]
    RunDetail:
      allOf:
        - $ref: "#/components/schemas/ResearchRun"
        - type: object
          properties:
            stages:
              type: array
              items:
                $ref: "#/components/schemas/StageCheckpoint"
            dossier:
              anyOf:
                - $ref: "#/components/schemas/ResearchDossier"
                - type: "null"
            verificationHash:
              type: ["string", "null"]
          required: [stages]
    EvidenceRecord:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
        provider:
          type: string
        type:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        retrievedAt:
          type: string
          format: date-time
        claimId:
          type: string
        claim:
          type: string
        claimKind:
          type: string
        published:
          type: ["string", "integer", "null"]
      required: [id, source, provider, type, title, url, retrievedAt, claimId, claim]
    ProviderStatus:
      type: object
      properties:
        provider:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [completed, failed, no_results]
        message:
          type: string
      required: [provider, label, status, message]
    ResearchDossier:
      type: object
      properties:
        executiveSummary:
          type: string
        findings:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              detail:
                type: string
              claimId:
                type: string
            required: [title, detail, claimId]
            additionalProperties: true
        sources:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceRecord"
        sourceMode:
          type: string
          enum: [live, fixtures]
        providerStatuses:
          type: array
          items:
            $ref: "#/components/schemas/ProviderStatus"
        evidenceDisclosure:
          type: string
      required: [executiveSummary, findings, sources, sourceMode, providerStatuses, evidenceDisclosure]
      additionalProperties: true

